<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#08080a"><title>Confirm your email — Aether</title><meta name="description" content="Confirm the email address on your Aether account."><meta name="robots" content="noindex"><link rel="icon" href="public/aether-logo.png" type="image/png"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="public/aether.css?v=7"><link rel="stylesheet" href="public/pages.css?v=7"><link rel="stylesheet" href="public/ui.css?v=7"></head><body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><a class="brand" href="index.html"><img src="public/aether-logo.png" alt=""><b>Aether</b></a><nav class="nav"><a href="index.html#services">Services</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="donate.html">Donate</a><a href="account.html">Account</a></nav><a class="header-cta" href="shop.html">Purchase <span>↗</span></a><button class="menu-btn" aria-label="Open menu">☰</button></header>

<main class="page-main" id="main">
  <span class="page-kicker">Email confirmation</span>
  <h1 id="ve-title">Confirming your<br><em>email address.</em></h1>
  <p class="page-lead" id="ve-lead">One moment — we are checking the link from your email.</p>

  <div class="ui-note" id="ve-note" style="margin-top:26px;max-width:620px" role="status" aria-live="polite">Working…</div>

  <div class="page-actions">
    <a class="outline-button" href="account.html">Go to your account</a>
    <a class="outline-button" href="index.html">Back home</a>
  </div>
</main>

<footer class="site-footer section-wrap"><a class="brand" href="index.html"><b>Aether</b></a><span>© 2026 Aether</span></footer>
<script src="public/aether-config.js?v=7"></script>
<script src="public/checkout.js?v=7"></script>
<script>
(() => {
  const C = window.AetherCheckout;
  if (!C) return;
  const note = document.getElementById("ve-note");
  const lead = document.getElementById("ve-lead");
  const title = document.getElementById("ve-title");
  const token = new URLSearchParams(location.search).get("token") || "";
  function done(ok, text, leadText) {
    note.className = "ui-note " + (ok ? "ok" : "warn");
    note.textContent = text;
    if (leadText) lead.textContent = leadText;
    if (!ok && title) title.innerHTML = "That link did not<br><em>work.</em>";
  }
  if (!token) { done(false, "This page needs the confirmation link from your email. Open the link exactly as it arrives.", "No confirmation token was found in this link."); return; }
  C.auth.verifyEmail(token)
    .then(() => {
      if (title) title.innerHTML = "Email<br><em>confirmed.</em>";
      done(true, "Thanks — your email address is confirmed on your Aether account.", "Your email address is confirmed. You can close this tab.");
    })
    .catch(err => done(false, err.message || "This confirmation link is invalid or has expired.", "The link is invalid or has expired."));
  if (C.markActiveNav) C.markActiveNav();
})();
</script>
<script src="public/aether.js?v=7" defer></script>
</body></html>
