name: Deploy production (main)

# Production/Alpha deploy. Only `main` may deploy the live site: a change that only
# exists on the `beta` branch can never overwrite production through this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inline JavaScript parses
        run: node _check-inline-js.mjs *.html
      - name: Email regex sanity
        run: node _check-email-regex.mjs
      - name: Worker is ASCII-only and compiles
        run: |
          node --check worker/src/index.js
          node -e "const s=require('fs').readFileSync('worker/src/index.js');let n=0;for(const b of s)if(b>127)n++;if(n){console.error('non-ASCII bytes: '+n);process.exit(1)}console.log('worker ASCII-only, '+s.length+' bytes')"
      - name: Worker test suite (D1 stub, 177 checks)
        run: node _test-worker.mjs

  deploy:
    name: Publish to GitHub Pages
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
