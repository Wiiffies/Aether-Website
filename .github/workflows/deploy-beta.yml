name: Beta (beta branch only)

# The Beta is a REAL, separately deployable environment: this workflow is the only one that
# publishes it, it runs ONLY from the `beta` branch, and it targets its own environment, its own
# hostname and — before real testers — its own Worker, KV namespace and D1 database.
#
# The obscure Beta URL only reduces accidental discovery. Access is enforced by the Worker
# (session + verified email + Tester role) — never by the URL, the branch name or a hidden button.
#
# This workflow deliberately does **not** fall back to this repository's Pages site: that site is
# production, and a `beta` push must never be able to overwrite it. Set the `beta` environment's
# `BETA_TARGET` variable (and `BETA_DEPLOY_TOKEN` secret) and wire the transfer step at the bottom;
# until then the publish job skips and only the checks run.
on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      beta_host:
        description: "Beta hostname (must be a subdomain of get-aether.de)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks + Worker suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refuse to publish a non-beta ref
        run: |
          if [ "${GITHUB_REF_NAME}" != "beta" ]; then
            echo "::error::This workflow only deploys the beta branch (got ${GITHUB_REF_NAME})."; exit 1
          fi
      - name: Inline JavaScript parses
        run: node _check-inline-js.mjs *.html
      - name: Email regex sanity
        run: node _check-email-regex.mjs
      - name: Shared assets + OG metadata
        run: node _check-assets.mjs
      - name: Worker is ASCII-only and compiles
        run: |
          node --check worker/src/index.js
          node -e "const s=require('fs').readFileSync('worker/src/index.js');let n=0;for(const b of s)if(b>127)n++;if(n){console.error('non-ASCII bytes: '+n);process.exit(1)}"
      - name: Worker test suite (D1 stub)
        run: node _test-worker.mjs
      - name: No secrets committed
        run: |
          if git ls-files -z | xargs -0 grep -nIE '(re_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16})' | grep -v '^\.env\.example:'; then
            echo "::error::A credential-looking value is committed. Remove it and rotate the key."
            exit 1
          fi
          echo "Secret scan clean (environment placeholders only)."
      - name: Beta build is identifiable
        run: |
          # The Beta branch must carry its own marker so a Beta build can never be mistaken for
          # production (see BETA_BRANCH.md).
          grep -q "betaDeployment" public/aether-config.js \
            && echo "Beta marker present." \
            || { echo "::error::public/aether-config.js is missing the betaDeployment marker."; exit 1; }

  deploy:
    name: Publish Beta build
    needs: checks
    if: ${{ vars.BETA_TARGET != '' }}
    runs-on: ubuntu-latest
    environment:
      name: beta # separate environment -> separate secrets/vars from production
    steps:
      - uses: actions/checkout@v4
      - name: Require the Beta deploy token
        env:
          BETA_DEPLOY_TOKEN: ${{ secrets.BETA_DEPLOY_TOKEN }}
        run: |
          test -n "$BETA_DEPLOY_TOKEN" || { echo "::error::BETA_DEPLOY_TOKEN is not set for the beta environment."; exit 1; }
          echo "Token present."
      - name: Deploy to the Beta target
        env:
          BETA_TARGET: ${{ vars.BETA_TARGET }}
          BETA_DEPLOY_TOKEN: ${{ secrets.BETA_DEPLOY_TOKEN }}
          BETA_HOST: ${{ inputs.beta_host || vars.BETA_HOST }}
        run: |
          echo "Target : $BETA_TARGET"
          echo "Host   : ${BETA_HOST:-<unset — the Worker's settings.beta_host decides>}"
          echo "::error::Wire the transfer for this target here (for example 'wrangler pages deploy .' "
          echo "to a Beta Pages project, or rsync/S3 with BETA_DEPLOY_TOKEN). Nothing was published."
          exit 1
