name: Beta (beta branch only)

# The Beta is a REAL, separately deployable environment: this workflow is the only one that
# publishes it, it runs ONLY from the `beta` branch, and it targets its own environment, its own
# hostname and — before real testers — its own Worker, KV namespace and D1 database.
#
# The obscure Beta URL only reduces accidental discovery. Access is enforced by the Worker
# (session + verified email + Tester role) — never by the URL, the branch name or a hidden button.
#
# This workflow deliberately does **not** fall back to this repository's Pages site: that site is
# production, and a `beta` push must never be able to overwrite it. Set the repository variable
# `BETA_TARGET` to a Cloudflare Pages project name and the publish job builds a site-only artifact
# and deploys it there with the same `CLOUDFLARE_API_TOKEN` the worker workflow uses (no separate
# Beta token). Until `BETA_TARGET` exists, the publish job skips and only the checks run.
on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      beta_host:
        description: "Beta hostname (must be a subdomain of get-aether.de)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks + Worker suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refuse to publish a non-beta ref
        run: |
          if [ "${GITHUB_REF_NAME}" != "beta" ]; then
            echo "::error::This workflow only deploys the beta branch (got ${GITHUB_REF_NAME})."; exit 1
          fi
      - name: Inline JavaScript parses
        run: node _check-inline-js.mjs *.html
      - name: Page markup is well formed
        run: node _check-markup.mjs
      - name: Email regex sanity
        run: node _check-email-regex.mjs
      - name: Shared assets + OG metadata
        run: node _check-assets.mjs
      - name: Account-recovery flow intact
        run: node _check-recovery.mjs
      - name: Tester download intact
        run: node _check-program.mjs
      - name: Pages stay loadable under the deployed CSP
        run: node _check-headers.mjs
      - name: No emoji in the product
        run: node _check-emoji.mjs
      - name: Worker is ASCII-only and compiles
        run: |
          node --check worker/src/index.js
          node -e "const s=require('fs').readFileSync('worker/src/index.js');let n=0;for(const b of s)if(b>127)n++;if(n){console.error('non-ASCII bytes: '+n);process.exit(1)}"
      - name: Worker test suite (D1 stub)
        run: node _test-worker.mjs
      - name: No secrets committed
        run: |
          if git ls-files -z | xargs -0 grep -nIE '(re_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16})' | grep -v '^\.env\.example:'; then
            echo "::error::A credential-looking value is committed. Remove it and rotate the key."
            exit 1
          fi
          echo "Secret scan clean (environment placeholders only)."
      - name: Beta build is identifiable
        run: |
          # The Beta branch must carry its own marker so a Beta build can never be mistaken for
          # production (see BETA_BRANCH.md).
          grep -q "betaDeployment" public/aether-config.js \
            && echo "Beta marker present." \
            || { echo "::error::public/aether-config.js is missing the betaDeployment marker."; exit 1; }

  deploy:
    name: Publish Beta build
    needs: checks
    if: ${{ vars.BETA_TARGET != '' }}
    runs-on: ubuntu-latest
    environment:
      name: beta # separate environment -> separate secrets/vars from production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BETA_TARGET: ${{ vars.BETA_TARGET }}
      BETA_HOST: ${{ inputs.beta_host || vars.BETA_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the deploy credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set - the Beta cannot be published."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID (repository variable) is not set."; exit 1; }
          echo "Target : $BETA_TARGET"
          echo "Host   : ${BETA_HOST:-<unset — the Worker's settings.beta_host decides>}"
      - name: Build the Beta artifact
        run: |
          set -euo pipefail
          # Never publish the repository itself: the artifact is the site only, the same shape the
          # GitHub Pages branch build produces for production (`_config.yml` excludes docs/tooling).
          rm -rf _beta_dist && mkdir -p _beta_dist/public
          cp public/* _beta_dist/public/ 2>/dev/null || true
          for f in *.html robots.txt sitemap.xml CNAME; do [ -e "$f" ] && cp "$f" _beta_dist/ || true; done
          test -f _beta_dist/index.html || { echo "::error::the artifact has no index.html"; exit 1; }
          grep -q "betaDeployment" _beta_dist/public/aether-config.js \
            || { echo "::error::the artifact is missing the betaDeployment marker."; exit 1; }
          echo "Beta artifact ready:"; ls -1 _beta_dist | head -30
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _beta_dist --project-name=${{ vars.BETA_TARGET }} --branch=beta
