name: Deploy aether-api worker

# The worker is deployed by CI when the Cloudflare API token secret exists, instead of the
# manual KV-relay recipe in MASTER_PROMPT.md. Nothing here runs without the secret, and the
# deploy keeps every existing binding + secret (`keep_bindings` semantics are automatic in
# wrangler: it only ever adds/updates what the config declares).
#
# Repo configuration this workflow expects (Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN   scoped token: Workers Scripts:Edit + Workers KV Storage:Edit + D1:Edit
#   variable CLOUDFLARE_ACCOUNT_ID  the account the worker lives in (not a secret)
#   secrets  RESEND_API_KEY, TURNSTILE_SECRET, NOWPAYMENTS_API_KEY,
#            NOWPAYMENTS_IPN_SECRET, NOWPAYMENTS_IPN_SECRET_2, DISCORD_WEBHOOK_URL
#            — the optional secret-sync below pushes only the ones that exist here, so the
#            dashboard and this repo can never silently disagree about a service key.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which worker to deploy"
        required: true
        default: "aether-api"
        type: choice
        options: ["aether-api", "aether-payments"]
  push:
    branches: [main]
    paths:
      - "worker/**"

permissions:
  contents: read

jobs:
  worker:
    name: Check + deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker is ASCII-only and compiles
        run: |
          node --check worker/src/index.js
          node -e "const s=require('fs').readFileSync('worker/src/index.js');let n=0;for(const b of s)if(b>127)n++;if(n){console.error('non-ASCII bytes: '+n);process.exit(1)}"
      - name: Test suite
        run: node _test-worker.mjs
      - name: Skip notice when the token is absent
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not configured - skipping the worker deploy (checks still ran)."
      - name: Deploy worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --name ${{ inputs.environment || 'aether-api' }} --keep-vars
      - name: Sync service secrets from GitHub (only the ones set here)
        # Never runs for pull requests, and never writes an empty value: a blank GitHub secret
        # leaves the live secret untouched, so this step cannot lock anyone out by accident.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
          NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
          NOWPAYMENTS_IPN_SECRET_2: ${{ secrets.NOWPAYMENTS_IPN_SECRET_2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          target="${{ inputs.environment || 'aether-api' }}"
          synced=""
          for name in RESEND_API_KEY TURNSTILE_SECRET NOWPAYMENTS_API_KEY NOWPAYMENTS_IPN_SECRET NOWPAYMENTS_IPN_SECRET_2 DISCORD_WEBHOOK_URL; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@3 secret put "$name" --name "$target"
              synced="$synced $name"
            fi
          done
          echo "Synced to $target from GitHub secrets:${synced:- none} (blank entries keep their live value)."
